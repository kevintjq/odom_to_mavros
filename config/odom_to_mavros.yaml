extrinsic:
  # T_fcu_lio_body：LIO body 坐标系到飞控 FCU body 坐标系的外参。
  # translation：LIO body 原点在 FCU body 坐标系中的位置，单位为米。
  # rotation：LIO body 坐标系相对于 FCU body 坐标系的姿态。
  translation:
    x: 0.0
    y: 0.0
    z: 0.0
  rotation:
    # 角度单位，可选 rad（弧度）或 deg（角度）。
    unit: deg
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

# 只需要配置下面两个监控参数，单位分别为 m/s 和 rad/s。
# max_flight_speed：无人机最大正常飞行速度，不要填理论极限速度。
max_flight_speed: 5.0
# max_angular_speed：无人机最大正常角速度，单位为 rad/s。
max_angular_speed: 10.0
# enable_auto_land_on_drift：检测到 LIO 漂移/异常时是否请求 MAVROS 切换 AUTO.LAND。
# 默认关闭。开启前请确认 PX4 已正确配置 AUTO.LAND 和相关 failsafe 行为。
enable_auto_land_on_drift: false
