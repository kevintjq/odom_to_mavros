# T_fcu_lio_body：LIO body 到 FCU body 的变换。
# translation：LIO body 原点在 FCU body 中的位置（米）。
# rotation：LIO body 相对 FCU body 的姿态，Rz(yaw) Ry(pitch) Rx(roll)。
extrinsic:
  translation:
    x: 0.0
    y: 0.0
    z: 0.0
  rotation:
    unit: deg
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

# 正常飞行速度上限，分别为 m/s 和 deg/s。
max_flight_speed: 5.0
max_angular_speed: 180.0

# 从采集时刻计算有效测量年龄，包含传输/处理延迟。
vision_pose_timeout: 0.2
# 启动/重启后仍未收到有效位姿的最长等待时间（秒）。
# 普通地面冷启动同样适用；本节点不判断飞机是否在空中。
startup_timeout: 5.0

# 连续异常：条数和持续时间必须同时满足。
invalid_pose_min_count: 3
invalid_pose_timeout: 0.05

# 间歇性异常：窗口内至少有这些样本，跨度至少 invalid_pose_timeout，
# 且异常占比 >= max_invalid_ratio。单帧正常数据不会清空窗口。
quality_window: 0.2
quality_min_samples: 10
max_invalid_ratio: 0.7

# false：只过滤数据和报告诊断，不启动 LAND 工作进程、不发送请求。
enable_vision_pose_timeout_protection: true
# 工作进程在正常阶段提前初始化，准备超时会回收重建。
land_worker_startup_timeout: 2.0
# 唤醒已准备好的工作进程后，服务调用/退出的最长等待时间。
land_service_timeout: 0.3
