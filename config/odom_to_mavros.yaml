extrinsic:
  # T_fcu_lio_body：LIO body 坐标系到飞控 FCU body 坐标系的外参。
  # translation：LIO body 原点在 FCU body 坐标系中的位置，单位为米。
  # rotation：LIO body 坐标系相对于 FCU body 坐标系的姿态。
  translation:
    x: 0.0
    y: 0.0
    z: 0.0
  rotation:
    # 角度单位，可选 rad（弧度）或 deg（角度）。
    unit: deg
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

# 以下是监控和超时保护参数；速度单位分别为 m/s 和 deg/s。
# max_flight_speed：无人机最大正常飞行速度，不要填理论极限速度。
max_flight_speed: 5.0
# max_angular_speed：无人机最大正常角速度，单位为 deg/s。程序内部会转换为 rad/s。
max_angular_speed: 180.0

# vision_pose_timeout：成功发布 vision pose 后，超过该时间未再次成功发布时判定为超时，单位为秒。
vision_pose_timeout: 0.2
# enable_vision_pose_timeout_protection：是否在 vision pose 超时时通过 MAVROS 请求 AUTO.LAND。
# 关闭后仍会在 /diagnostics 报告超时，但不会请求切换飞行模式。
enable_vision_pose_timeout_protection: true
